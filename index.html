<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/siyak-logo.png" />
    <link rel="apple-touch-icon" href="/img/siyak-logo.png" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" crossorigin media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" crossorigin />
    </noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="/css/main.min.css" />
    <link rel="stylesheet" href="/css/settings.min.css" />
    <link href="/css/css.css" rel="stylesheet" type="text/css" />
    <link href="/css/css_1.css" rel="stylesheet" type="text/css" />
    <link href="/css/css_2.css" rel="stylesheet" type="text/css" />
    <link href="/css/translateelement.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/animate.css" />
    <title>Siyak Steel International | ISO 9001:2015 Certified Exporter</title>
    <meta
      name="description"
      content="Siyak Steel International — ISO 9001:2015 certified manufacturer, stockist and exporter of pipes, tubes, flanges, fittings, fasteners, bars, plates and valves, serving 40+ countries."
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- scripts for exact layout and slider -->
    <script src="/js/jquery-1.9.1.js"></script>
    <script src="/js/jquery-migrate-1.2.1.min.js"></script>
    <script src="/js/modernizr.custom.js"></script>
    <script src="/js/jquery.dlmenu.js"></script>
    <script src="/js/retina-1.1.0.min.js"></script>
    <script src="/js/jquery.themepunch.plugins.min.js"></script>
    <script src="/js/jquery.themepunch.revolution.min.js"></script>
    <script src="/js/jquery.prettyPhoto.js"></script>
    <script src="/js/jquery.nivo.slider.js"></script>
    <script src="/js/include.js"></script>
    <script>
        setTimeout(() => {
            if (jQuery('.tp-banner').length > 0) {
                jQuery('.tp-banner').show().revolution({
                    delay: 5000,
                    effect: "slideInRight",
                    startwidth: 1200,
                    startheight: 350,
                    hideThumbs: 10,
                    navigationType: "bullet"
                });
            }
        }, 1000); // Give React time to mount the HTML
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
